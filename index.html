<!DOCTYPE html>
<html>
    <title>3D Rendering</title>
    <body>
        <style>
            body {
                margin: 0;
                padding: 0;
            }
            
            canvas {
                display: inline-block;
                float: left;
                width: 100%;
                height: 100%;
            }
        </style>
        
        <canvas id="main"></canvas>
        
        <!--
        <p id="p1"></p>
        <p id="p2"></p>
        <p id="p3"></p>
        <p id="p4"></p>
        <p id="p5"></p>
        -->
        <script>
          
/*
notes:
this version has all instances of "*****" replaced with "but" + "t"
*/

const main = document.getElementById("main");
const ctxMain = main.getContext("2d");

main.width = window.innerWidth;
main.height = window.innerHeight;

let fps = 60;
let upf = 20;
let ptime = 0;

let context;
let camera;
let objects = [];
let cameraMoveSpeed = 5;
let cameraRotateSpeed = 1;

let pressedKeys = [];

function randColor() {
  return new Color(Math.floor(Math.random() * 256), Math.floor(Math.random() * 256), Math.floor(Math.random() * 256), 256);
}

function Context2d(canvas) {
  this.canvas = canvas;
  this.ctx = canvas.getContext("2d");
  
  this.getPixels = function() {
    this.width = canvas.width;
    this.height = canvas.height;
    this.size = this.width * this.height;
    this.len = this.size;
    this.len4 = this.len * 4;
    this.pixels = this.ctx.getImageData(0, 0, this.width, this.height);
    this.depth = new Array(this.len).fill(0);
  }
  
  this.putPixels = function() {
    this.ctx.putImageData(this.pixels, 0, 0);
  }
  
  this.getPixels();
  
  this.onCanvas = function(point) {
    let x = Math.round(point.x);
    let y = Math.round(point.y);
    return x >= 0 && x < this.width && y >= 0 && y < this.height;
  }
  
  this.offCanvas = function(points) {
    let left = true;
    let right = true;
    let above = true;
    let below = true;
    for (let p of points) {
      let x = Math.round(p.x);
      let y = Math.round(p.y);
      left &= x < 0;
      right &= x >= this.width;
      above &= y < 0;
      below &= y >= this.height;
    }
    return left || right || above || below;
  }
  
  this.fill = function(color) {
    this.depth.fill(0);
    for (let n = 0; n < this.len4; n += 4) {
      this.pixels.data[n] = color.r;
      this.pixels.data[n + 1] = color.g;
      this.pixels.data[n + 2] = color.b;
      this.pixels.data[n + 3] = color.a;
    }
  }
  
  this.setPixel = function(point, color, force = false) {
    if (force || this.onCanvas(point)) {
      let n = point.x + this.width * point.y;
      if (point.z == undefined || point.z >= this.depth[n]) {
        this.depth[n] = point.z ?? 0;
        n *= 4;
        this.pixels.data[n] = color.r;
        this.pixels.data[n + 1] = color.g;
        this.pixels.data[n + 2] = color.b;
        this.pixels.data[n + 3] = color.a;
      }
    }
  }
  
  this.strokeLine = function(points, color) {
    if (this.offCanvas(points)) return;
    let allOn = this.onCanvas(points[0]) && this.onCanvas(points[1]);
    
    let inc = points[1].copy().minus(points[0]);
    let numIncs = Math.max(Math.abs(inc.x), Math.abs(inc.y))
    inc.scale(1 / numIncs);
    let pixel = points[0].copy();
    this.setPixel(pixel, color, allOn);
    for (let n = 0; n < numIncs; n++) {
      pixel.plus(inc);
      this.setPixel(pixel.copy().forEach(Math.round), color, allOn);
    }
  }
  
  this.strokeTri = function(tri) {
    if (this.offCanvas(tri.points)) return;
    let allOn = this.onCanvas(tri.points[0]) && this.onCanvas(tri.points[1]) && this.onCanvas(tri.points[2]);
    let points = tri.points.toSorted((p1, p2) => (p1.x - p2.x || p1.y - p2.y));
    this.strokeLine([points[0], points[1]], tri.color, allOn);
    this.strokeLine([points[1], points[2]], tri.color, allOn);
    this.strokeLine([points[0], points[2]], tri.color, allOn);
  }
  
  this.fillTri = function(tri) {
    if (this.offCanvas(tri.points)) return;
    let allOn = this.onCanvas(tri.points[0]) && this.onCanvas(tri.points[1]) && this.onCanvas(tri.points[2]);
    let points = tri.points.toSorted((p1, p2) => (p1.x - p2.x || p1.y - p2.y));
    
    if (points[0].x == points[2].x) {
      this.strokeLine([points[0], points[2]], tri.color, allOn);
    } else {
      let inc1 = points[1].copy().minus(points[0]);
      inc1.scale(1 / Math.max(Math.abs(inc1.x), Math.abs(inc1.y)));
      let pixel1 = points[0].copy();
      
      let inc2 = points[2].copy().minus(points[0]);
      inc2.scale(1 / Math.max(Math.abs(inc2.x), Math.abs(inc2.y)));
      let pixel2 = points[0].copy();
      let xf = Math.round(points[1].x);
      for (let x = Math.round(points[0].x); x < xf; x++) {
        let first = pixel1.y <= pixel2.y ? pixel1 : pixel2;
        let yf = Math.max(pixel1.y, pixel2.y);
        let incV = pixel2.copy().minus(pixel1);
        incV.scale(1 / incV.y);
        incV.x = 0;
        for (let v = new Vector3(Math.round(x), Math.round(first.y), first.z, false); v.y < yf; v.plus(incV)) {
          this.setPixel(v.copy().forEach(Math.round), tri.color, allOn);
        }
        while (Math.round(pixel1.x) == x) {
          pixel1.plus(inc1);
          this.setPixel(pixel1.copy().forEach(Math.round), tri.color, allOn);
        }
        while (Math.round(pixel2.x) == x) {
          pixel2.plus(inc2);
          this.setPixel(pixel2.copy().forEach(Math.round), tri.color, allOn);
        }
      }
      
      inc1 = points[2].copy().minus(points[1]);
      inc1.scale(1 / Math.max(Math.abs(inc1.x), Math.abs(inc1.y)));
      pixel1 = points[1].copy();
      
      xf = Math.round(points[2].x);
      for (let x = Math.round(points[1].x); x < xf; x++) {
        let first = pixel1.y <= pixel2.y ? pixel1 : pixel2;
        let yf = Math.max(pixel1.y, pixel2.y);
        let incV = pixel2.copy().minus(pixel1);
        incV.scale(1 / incV.y);
        incV.x = 0;
        for (let v = new Vector3(Math.round(x), Math.round(first.y), first.z, false); v.y < yf; v.plus(incV)) {
          this.setPixel(v.copy().forEach(Math.round), tri.color, allOn);
        }
        while (Math.round(pixel1.x) == x) {
          pixel1.plus(inc1);
          this.setPixel(pixel1.copy().forEach(Math.round), tri.color, allOn);
        }
        while (Math.round(pixel2.x) == x) {
          pixel2.plus(inc2);
          this.setPixel(pixel2.copy().forEach(Math.round), tri.color, allOn);
        }
      }
      
      let pointsByY = [points[2], pixel1, pixel2].toSorted((p1, p2) => (p1.y - p2.y));
      let yf = pointsByY[2].y
      let incV = pointsByY[2].copy().minus(pointsByY[0]);
      incV.scale(1 / incV.y);
      incV.x = 0;
      for (let v = new Vector3(Math.round(points[2].x), Math.round(pointsByY[0].y), pointsByY[0].z, false); v.y <= yf; v.plus(incV)) {
        this.setPixel(v.copy().forEach(Math.round), tri.color, allOn);
      }
      
    }
  }
}

function Camera(p, a, w, h) {
  this.p = p;
  this.a = a;
  this.w = w;
  this.h = h;
  
  this.setVars = function() {
    this.magA = this.a.mag();
    this.magW = this.w.mag();
    this.magH = this.h.mag();
    this.unitA = this.a.copy().scale(1 / this.magA);
    this.unitW = this.w.copy().scale(1 / this.magW);
    this.unitH = this.h.copy().scale(1 / this.magH);
    this.r = this.a.mag();
    this.constR = this.r * (this.a.x * (this.w.y * this.h.z - this.w.z * this.h.y) + this.a.y * (this.w.z * this.h.x - this.w.x * this.h.z) + this.a.z * (this.w.x * this.h.y - this.w.y * this.h.x));
    this.transform = [[
        -this.w.z * this.h.y + this.w.y * this.h.z,
        this.w.z * this.h.x + -this.w.x * this.h.z,
        -this.w.y * this.h.x + this.w.x * this.h.y
      ], [
        this.a.z * this.h.y + -this.a.y * this.h.z,
        -this.a.z * this.h.x + this.a.x * this.h.z,
        this.a.y * this.h.x + -this.a.x * this.h.y
      ], [
        -this.a.z * this.w.y + this.a.y * this.w.z,
        this.a.z * this.w.x + -this.a.x * this.w.z,
        -this.a.y * this.w.x + this.a.x * this.w.y
    ]];
  }
  
  this.setVars();
  
  this.project = function(v) {
    let angle = v.copy().minus(this.p);
    let constA = angle.x * this.transform[0][0] + angle.y * this.transform[0][1] + angle.z * this.transform[0][2];
    if (constA >= this.constR) {
      let constW = (angle.x * this.transform[1][0] + angle.y * this.transform[1][1] + angle.z * this.transform[1][2]) / constA;
      let constH = (angle.x * this.transform[2][0] + angle.y * this.transform[2][1] + angle.z * this.transform[2][2]) / constA;
      return new Vector3(constW, constH, (constA == 0 ? -1 : this.constR / constA), false);
    } else {
      return null;
    }
  }
  
  this.move = function(a, w, h) {
    this.p.plus(this.a.copy().withMag(a)).plus(this.w.copy().withMag(w)).plus(this.h.copy().withMag(h));
    this.setVars();
  }
  
  this.rotate = function(theta, phi) {
    let cosTheta = Math.cos(theta);
    let sinTheta = Math.sin(theta);
    let cosPhi = Math.cos(phi);
    let sinPhi = Math.sin(phi);
    let vecX = new Vector3(this.unitA.x, this.unitW.x, this.unitH.x);
    let vecY = new Vector3(this.unitA.y, this.unitW.y, this.unitH.y);
    let vecZ = new Vector3(this.unitA.z, this.unitW.z, this.unitH.z);
    let vec1 = new Vector3(cosTheta * cosPhi, -sinTheta, cosTheta * sinPhi);
    let vec2 = new Vector3(sinTheta * cosPhi, cosTheta, sinTheta * sinPhi);
    let vec3 = new Vector3(-sinPhi, 0, cosPhi);
    this.a = new Vector3(vecX.dot(vec1), vecY.dot(vec1), vecZ.dot(vec1)).withMag(this.magA);
    this.w = new Vector3(vecX.dot(vec2), vecY.dot(vec2), vecZ.dot(vec2)).withMag(this.magW);
    this.h = new Vector3(vecX.dot(vec3), vecY.dot(vec3), vecZ.dot(vec3)).withMag(this.magH);
    this.setVars();
  }
}

function Color(r, g, b, a = 255) {
  this.r = r;
  this.g = g;
  this.b = b;
  this.a = a;
  this.list = [this.r, this.g, this.b, this.a];
  this.string = "rgb(" + this.r + ", " + this.g + ", " + this.b + ", " + (this.a / 256) + ")";
}

function Vector2(x, y) {
  this.x = x;
  this.y = y;
  
  this.copy = function() {
    return new Vector2(this.x, this.y);
  }
  
  this.toList = function() {
    return [this.x, this.y];
  }
  
  this.mag = function() {
    return Math.sqrt(this.x * this.x + this.y * this.y);
  }
  
  this.forEach = function(func) {
    this.x = func(this.x);
    this.y = func(this.y);
    return this;
  }
  
  this.scale = function(f) {
    this.x *= f;
    this.y *= f;
    return this;
  }
  
  this.withMag = function(m) {
    return this.scale(m / this.mag());
  }
  
  this.unit = function() {
    return this.withMag(1)
  }
  
  this.plus = function(v) {
    this.x += v.x;
    this.y += v.y;
    return this;
  }
  
  this.minus = function(v) {
    this.x -= v.x;
    this.y -= v.y;
    return this;
  }
  
  this.dot = function(v) {
    return this.x * v.x + this.y * v.y;
  }
}

function Vector3(x, y, z, useZ = true) {
  this.x = x;
  this.y = y;
  this.z = z;
  this.useZ = useZ;
  
  this.copy = function() {
    return new Vector3(this.x, this.y, this.z, this.useZ);
  }
  
  this.toList = function() {
    return [this.x, this.y, this.z];
  }
  
  this.mag = function() {
    return Math.sqrt(this.x * this.x + this.y * this.y + (this.useZ ? this.z * this.z : 0));
  }
  
  this.forEach = function(func) {
    this.x = func(this.x);
    this.y = func(this.y);
    if (this.useZ) this.z = func(this.z);
    return this;
  }
  
  this.scale = function(f) {
    this.x *= f;
    this.y *= f;
    this.z *= f;
    return this;
  }
  
  this.withMag = function(m) {
    return this.scale(m / this.mag());
  }
  
  this.unit = function() {
    return this.withMag(1);
  }
  
  this.plus = function(v) {
    this.x += v.x;
    this.y += v.y;
    this.z += v.z;
    return this;
  }
  
  this.minus = function(v) {
    this.x -= v.x;
    this.y -= v.y;
    this.z -= v.z;
    return this;
  }
  
  this.dot = function(v) {
    return this.x * v.x + this.y * v.y + this.z * v.z;
  }
}

function Triangle(points, color) {
  this.points = points;
  this.color = color;
}

function Tetrahedron(points, color, magA) {
  this.points = [];
  for (let p of points) {
    this.points.push(p.copy());
  }
  this.color = color;
  this.magA = magA ?? 0;
  
  this.v = new Vector3(0, 0, 0);
  
  this.setTriangles = function() {
    this.triangles = [
      new Triangle([this.points[0], this.points[1], this.points[2]], this.color),
      new Triangle([this.points[0], this.points[1], this.points[3]], this.color),
      new Triangle([this.points[0], this.points[2], this.points[3]], this.color),
      new Triangle([this.points[1], this.points[2], this.points[3]], this.color)
    ];
  }
  
  this.setTriangles();
  
  this.getTriangles = function() {
    return this.triangles;
  }
  
  this.move = function(dp) {
    for (let p of this.points) {
      p.plus(dp);
    }
    this.setTriangles();
  }
  
  this.update = function(dt) {
    let a = new Vector3(Math.random() - 0.5, Math.random() - 0.5, Math.random() - 0.5).withMag(magA).scale(dt);
    this.move(a.copy().scale(1 / 2).plus(this.v).scale(dt));
    this.v.plus(a);
  }
}

function Cube(points, color, magA) {
  this.points = [];
  for (let p of points) {
    this.points.push(p.copy());
  }
  this.color = color;
  this.magA = magA ?? 0;
  
  this.v = new Vector3(0, 0, 0);
  
  this.setTriangles = function() {
    this.triangles = [];
    for (let n1 = 1; n1 < 4; n1++) {
      for (let n2 = 1; n2 < 4; n2++) {
        if (n1 != n2) {
          let corner = this.points[n1].copy().plus(this.points[n2]).minus(this.points[0]);
          this.triangles.push(new Triangle([this.points[0], this.points[n1], corner], this.color));
          this.triangles.push(new Triangle([this.points[n1], corner, corner.copy().plus(this.points[6 - n1 - n2]).minus(this.points[0])], this.color));
        }
      }
    }
  }
  
  this.setTriangles();
  
  this.getTriangles = function() {
    return this.triangles;
  }
  
  this.move = function(dp) {
    for (let p of this.points) {
      p.plus(dp);
    }
    this.setTriangles();
  }
  
  this.update = function(dt) {
    let a = new Vector3(Math.random() - 0.5, Math.random() - 0.5, Math.random() - 0.5).withMag(magA).scale(dt);
    this.move(a.copy().scale(1 / 2).plus(this.v).scale(dt));
    this.v.plus(a);
  }
}

document.onmousemove = function(event) {
  
}

document.onkeydown = function(event) {
  if (!pressedKeys.includes(event.key.toLowerCase())) {
    pressedKeys.push(event.key.toLowerCase());
  }
}

document.onkeyup = function(event) {
  if (pressedKeys.includes(event.key.toLowerCase())) {
    pressedKeys.splice(pressedKeys.indexOf(event.key.toLowerCase()), 1);
  }
}

main.onmousedown = function(event) {
  
}

main.onmouseup = function(event) {
  
}

function setup() {
  
  context = new Context2d(main);
  camera = new Camera(new Vector3(-1.5, -1.5, -1.5), new Vector3(1, 1, 1).withMag(1), new Vector3(1, 0, -1/3).withMag(2 / main.width), new Vector3(0, 1, -2/3).withMag(2 / main.height));
  
  let n = 2;
  for (let x = -n; x <= n; x++) {
    for (let y = -n; y <= n; y++) {
      for (let z = -n; z <= n; z++) {
        objects.push(new Cube([
          new Vector3(x, y, z),
          new Vector3(x + 0.3, y, z),
          new Vector3(x, y + 0.3, z),
          new Vector3(x, y, z + 0.3),
        ], randColor(), 1 / 5));
      }
    }
  }
  
}

function show() {
  
  context.fill(new Color(0, 0, 0));
  
  let triangles = [];
  for (let o of objects) {
    triangles.push(...o.getTriangles());
  }
  
  let mainOffset = new Vector3(main.width / 2, main.height / 2, 0, false);
  for (let t of triangles) {
    let p1 = camera.project(t.points[0]);
    let p2 = camera.project(t.points[1]);
    let p3 = camera.project(t.points[2]);
    if (p1 != null && p2 != null && p3 != null) context.fillTri(new Triangle([p1.plus(mainOffset), p2.plus(mainOffset), p3.plus(mainOffset)], t.color));
  }
  
  context.putPixels();
  
}

function update(dt) {
  
  for (let o of objects) {
    o.update(dt);
  }
  
}

function frame(time) {
  
  dt = (time - ptime) / 1000;
  
  let cameraMovement = [cameraMoveSpeed * dt * ((pressedKeys.includes("w") - pressedKeys.includes("s"))), cameraMoveSpeed * dt * ((pressedKeys.includes("d") - pressedKeys.includes("a"))), cameraMoveSpeed * dt * ((pressedKeys.includes("shift") - pressedKeys.includes(" ")))];
  if (cameraMovement[0] != 0 || cameraMovement[1] != 0 || cameraMovement[2] != 0) camera.move(...cameraMovement);
  
  let cameraRotation = [cameraRotateSpeed * dt * ((pressedKeys.includes("arrowleft") - pressedKeys.includes("arrowright"))), cameraRotateSpeed * dt * ((pressedKeys.includes("arrowdown") - pressedKeys.includes("arrowup")))];
  if (cameraRotation[0] != 0 || cameraRotation[1] != 0) camera.rotate(...cameraRotation);
  
  if (dt * fps > 0.9) {
    if (dt > 0 && dt < 100) {
      let ut = dt / upf;
      for (let n = 0; n < upf; n++) {
        update(ut);
      }
    }
    
    show();
  }
  
  ptime = time;
  
  requestAnimationFrame(frame);
  
}

setup();
show();
requestAnimationFrame(frame);
          
        </script>
    </body>
